<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <title>DnD Spells</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="slider__container">
          <h3>Spell Level</h3>
          <div class="range-slider">
            <input type="number" class="min-level" value="0" min="0" max="9" />
            <input type="number" class="max-level" value="9" min="0" max="9" />

            <div class="range">
              <input type="range" class="min-input" value="0" min="0" max="9" />
              <input type="range" class="max-input" value="9" min="0" max="9" />
              <div class="slider">
                <div class="progress"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row">
        <div class="spell-list">
          <div class="spell">
            <div class="spell-card">
              <div id="spell-card__container" class="spell-card__container">
                <h3>Spell Name:</h3>
                <p><b>Level:</b></p>
                <p><button id="api-btn">See Reverse for Description</button></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="spell">
            <div class="spell-card">
              <div class="spell-card__info--container">
                <h3>Spell Name:</h3>
                <p><b>Level:</b></p>
                <p><b>Desc.:</b></p>
              </div>
            </div>
          </div>
        </div>
    </div>
  </body>
</html>
